; ============================================================================
; Favorites Menu Grid - F4SE
;
; Several pages of Fallout 4's twelve favorite keys, drawn all at once as a
; grid you can point at, walk with the keys or a controller, and use from.
; The same grid replaces the Pip-Boy's ASSIGN FAVORITE cross, so a favorite
; can be put straight onto any page.
;
; This file lives in Data\F4SE\Plugins next to the DLL and is read once when
; the plugin loads, so changes need a restart of the game.
;
; Each option is listed first, its accepted values next, and what it does
; underneath. Section names cannot be renamed.
; ============================================================================


; ----------------------------------------------------------------------------
[Pages]
; ----------------------------------------------------------------------------

PageCount=3
; 1 to 8 pages.   Default: 3
; Each page is a full set of the twelve favorite keys. Page 1 is whatever the
; character already had when the pages were first used. Eight is ninety-six
; keys, and the cap is a judgement rather than a limit: past it the grid stops
; being something you read at a glance.

DefaultPage=0
; 0, or a page number from 1 to PageCount.   Default: 0
; The page put back into the game's real twelve keys every time the menu
; closes, so the digits 1-0 outside the menu always mean this page whatever
; you did while it was open. 0 leaves whichever page you last used.
;
; It is not free: a page switch moves every favorite through the engine one
; key at a time, and this does it on every close.

; ----------------------------------------------------------------------------
[Grid]
; ----------------------------------------------------------------------------

GridCellSize=48
; 24 to 96.   Default: 48
; How big one cell is, in the units Fallout 4 lays its menus out in, of which
; the screen is 1280 by 720. Everything else - gaps, margins, the key numbers,
; the icons - follows from this one number, so it is the one to turn. 48 makes
; the panel about half the screen wide, 64 two thirds.

ShowPageNumbers=1
; 0 or 1.   Default: 1
; The page numbers down the left side. They are the one thing on the panel
; that says which row is which; turning them off makes the panel that much
; narrower.

GridCorners=0
; 0 or 1.   Default: 0
; Four short right angles around the grid, the way the game frames a target or
; something chosen. Not an outline: an outline closes a thing off, a corner
; mark points at it. Off because the grid is meant to pass for something the
; game drew, and the game draws nothing around its own cells - but the corner
; mark is very much its language, so it is worth a look.

HideCrosshair=1
; 0 or 1.   Default: 1
; Puts the HUD's crosshair out of sight while the menu is open. It sits in the
; middle of the screen, which is where the grid is, and it aims at nothing
; while a menu is up. A replaced HUD that names its crosshair something
; unusual simply keeps it, and the log says so.

ShowKeyHints=1
KeyHintExtra=TAB) CLOSE
; 0 or 1, and a line of text.   Defaults: 1 and "TAB) CLOSE"
; A line under the panel naming the keys it answers to, built from the keys as
; they are actually bound - change one and the line changes. It also follows
; what is in your hands: press a controller button and it names controller
; buttons, drawn with the game's own button art.
;
; KeyHintExtra is added to the end as it stands, because the key that closes
; the favorites menu belongs to the game and nothing tells us which it is -
; whatever you opened the menu with is what closes it. On a controller that
; button is known and drawn, and this text is not used.


; ---- Icons -----------------------------------------------------------------

UseIcons=1
; 0 or 1.   Default: 1
; Draws each cell's item icon, the same symbol you already see in FallUI's
; menus. None of that artwork is shipped with this mod: an item sorter renames
; items with a tag in front - "[Aid] Antibiotics" - and a tag configuration
; under Data\Interface\ItemSorter maps that tag to a symbol in an icon
; library. Both are read where you already have them, and every configuration
; found is merged, so it does not matter which sorter is active.
;
; Without a sorter, or without any library, the cells stay empty and
; everything else works unchanged.

IconFallback=1
; 0 or 1.   Default: 1
; Gives something a symbol even when no sorter has heard of it, which on a
; heavily modded game is most weapons. It goes by what kind of thing it is: a
; gun gets the rifle symbol, a melee weapon the one for its grip, armour the
; vest, aid the med kit. Every one of those is a symbol the sorter defines
; itself, so it matches the rest.

IconColors=1
; 0 or 1.   Default: 1
; Paints an icon in the colour its tag asks for - aid red, explosives orange -
; taken from the colour set you picked in FallUI's own settings. Off leaves
; the artwork the colour it was drawn in.

StripItemTags=1
; 0 or 1.   Default: 1
; Drops the "[Aid]" an item sorter puts in front of a name before the panel
; shows it. The tag has already done its work by then: it is what chose the
; icon.


; ----------------------------------------------------------------------------
[Controls]
; ----------------------------------------------------------------------------
;
; These keys mean something only while the favorites menu is open. The grid
; stands in front of everyone else in the game's list of input handlers and
; claims exactly these; everything it does not claim - the digits, the key
; that closes the menu - goes through untouched.
;
; One limit worth knowing: a mod that reads the keyboard directly never sees
; that a menu claimed a key. That is why the defaults avoid letters that
; gameplay mods tend to use.
;
; A key is written by name (E, DELETE, INSERT, F6, PAGEUP), as a numeric key
; code, or NONE to switch it off.

GridPageUpKey=W
GridPageDownKey=S
GridLeftKey=A
GridRightKey=D
; Defaults: W, S, A, D
; One page up and down - the rows of the panel - and one key left and right
; within a page. Holding one walks on by itself.

GridUseKey=E
; Default: E
; Uses what is marked. A cell on another page turns to that page first: the
; twelve keys belong to one page at a time, and the engine is what hands them
; out. E because it is what activates everything else in this game; Return
; does the same and is always on.

GridUseOnClick=1
; 0 or 1.   Default: 1
; Whether the left mouse button uses whatever the pointer is over.

GridCloseAfterUse=1
; 0 or 1.   Default: 1
; Closes the favorites menu after something was used, the way the vanilla
; cross does when a digit is pressed. A refusal leaves it open - the game has
; just said no out loud.

GridToggleEquip=1
; 0 or 1.   Default: 1
; A second press on something you are already wearing or holding takes it off
; again, the way holstering works everywhere else in this game. It is the
; engine's own doing rather than a second call of ours, so the engine's rules
; apply, power armour included. Never applies to aid, which is used up rather
; than put on.

GridMoveKey=INSERT
; Default: INSERT
; Picks the marked cell up; the next press puts it down on whatever is marked
; then, and the two change places. Works across pages, which is the point:
; that is how something moves from page 3 to page 1 without going through the
; Pip-Boy.

GridClearKey=DELETE
; Default: DELETE
; Frees the key the mark sits on. Nothing is deleted and nothing stops being a
; favorite: the item goes to the same "favorited, no key" state the game
; writes when you favorite something without assigning a digit.

GridWrap=1
; 0 or 1.   Default: 1
; Whether the ends of a row and of the stack are doors or walls - whether
; moving right from the last key comes back to the first.

GridHidePointer=1
; 0 or 1.   Default: 1
; Whether the mouse pointer goes out of sight while the keys or the D-pad have
; the mark, and comes back when the mouse or the right stick moves. It is not
; decoration: a pointer lying over some other cell would hand the choice
; straight back on the next frame.

GridGamepad=1
GridGamepadStick=1
; 0 or 1.   Defaults: 1 and 1
; Whether a controller works the grid, and whether the left stick walks the
; mark as well as the D-pad. The stick costs you walking while the menu is
; open, which is the same price W and S already charge on a keyboard.
;
; The D-pad walks, A uses, X picks up, Y clears. Two buttons are never taken:
; B, and whichever button your game has bound to the favorites menu itself -
; those are the ways out, and they are read from your own bindings rather than
; assumed.
