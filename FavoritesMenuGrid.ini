; Favorites Menu Grid for Fallout 4
;
; This file lives in Data\F4SE\Plugins next to the DLL. It is read once when
; the plugin loads, so changes need a restart of the game.

[Debug]

; The keys of the current test build. They will go away once the grid itself
; is here; until then they are the whole user interface.
;
; A key is written by name -- F6, DELETE, NUMPAD7, PAGEUP -- or as a virtual
; key code in decimal or hex (0x75). NONE switches a key off.
;
; Pick keys the game and your other software leave alone. F5 and F9 are
; quicksave and quickload in Fallout 4, and on this machine Special K takes
; F8 and F9 for screenshots.

InventoryProbeKey=F6
; Writes the twelve favorites to the log, as the inventory has them and as
; the game's own copy has them.   Default: F6

SwapFavoritesKey=F8
; Exchanges the two lowest occupied keys, through the engine's own write
; path -- the page switch in miniature. Pressing it again puts everything
; back.   Default: F8
