; Favorites Menu Grid for Fallout 4
;
; This file lives in Data\F4SE\Plugins next to the DLL. It is read once when
; the plugin loads, so changes need a restart of the game.

[Debug]

; The probe keys of the current test build. They will go away once the grid
; itself is here; until then they are the whole user interface.
;
; A key is written by name -- F6, DELETE, NUMPAD7, PAGEUP -- or as a virtual
; key code in decimal or hex (0x75). NONE switches a key off.
;
; Pick keys the game and your other software leave alone. F5 and F9 are
; quicksave and quickload in Fallout 4, and Steam's screenshot key is on F12
; by default but is often moved.

InventoryProbeKey=F6
; Lists every inventory stack that carries a favorite, then every stack of
; those items in detail.   Default: F6

DisplayListKey=F7
; Writes the display list of the favorites menu to the log.   Default: F7

SwapFavoritesKey=F8
; Exchanges the keys of the two favorites with the lowest indices, by writing
; both the binding on the inventory stacks and the game's own note of which
; kind of item belongs on which key. Pressing it again puts everything back.
; Default: F8

RefreshMenuKey=F10
; Sends one UI message to the favorites menu per press, walking through the
; candidates: kInventoryUpdate, kUpdate, kReshow, kShow, then round again.
; The log says which one was just sent, so the one that makes the menu
; re-read the favorites can be recognised by its effect.   Default: F10
