; Favorites Menu Grid for Fallout 4
;
; This file lives in Data\F4SE\Plugins next to the DLL. It is read once when
; the plugin loads, so changes need a restart of the game.

[Display]

; What the favorites menu shows.

UseGrid=1
; Draws every page at once, in the middle of the screen: one row per page, one
; cell per key, with the page being played picked out. The cross steps out of
; sight while it is up -- the same twelve keys read twice, once in the middle
; and once in the corner, is one reading too many. The keys themselves work
; exactly as before. Set it to 0 to keep the vanilla cross.
; Still early: cells carry names, the icons come next.   Default: 1

GridMenu=FavoritesMenuGrid
; Which menu the grid is drawn on. The favorites menu only paints a strip
; around its own cross, so anything of ours outside that never reaches the
; screen -- the HUD covers everything and is repainted all over. Set it to
; FavoritesMenu to see the difference.   Default: HUDMenu

GridX=-1
GridY=-1
; Where the panel sits, in stage units of a 1280x720 stage. -1 means centred.
; Defaults: -1 and -1

GridCellSize=48
; How big one cell is, in units of the 1280x720 stage both Fallout 4 and
; Starfield lay their menus out on. Everything else -- gaps, text, the
; margins, how much of a name fits -- follows from this one number, so it is
; the only one to turn. 24 to 96.
;
; For scale: 48 makes the panel about half the screen wide, 64 two thirds.
; Starfield's grid uses 66 and comes out wider still, because its cells hold
; icons where ours still hold a name.   Default: 48

UseIcons=1
; Draws each cell's item icon, the same symbol the player already sees in
; FallUI's menus. Nothing of that is shipped with this mod: an item sorter
; renames items with a tag in front -- "[Aid] Antibiotics" -- and a tag
; configuration under Data\Interface\ItemSorter maps that tag to a symbol in
; an icon library. Both are read where the player already has them, which is
; what FallUI's own auto-detect does.
;
; Every configuration found is read and merged, so it does not matter which
; sorter is active: a keyword is looked up by what the item is actually
; called. Alternative icon sets ("variations") are only read when MCM says
; they are chosen -- reading them all made Stimpak come out as a med kit.
; Each mod that brings its own artwork brings its own library, and only the
; libraries a page actually needs are loaded.
;
; Without a sorter, or without any library, the cells simply stay empty and
; everything else works unchanged.   Default: 1

IconColors=1
; Paints an icon in the colour its tag asks for -- aid red, explosives
; orange. The artwork is white so that something can. Set it to 0 to leave
; the icons white.   Default: 1

IconFit=78
; How much of a cell an icon fills, in percent, with its proportions kept.
; The game's own cell gives its icon nearly the whole square; a little air
; keeps the plates readable as a lattice. 20 to 100.   Default: 78

GridColor=16777216
; The colour of the whole panel -- plates, key names, row numbers and the mark
; -- as one number, red*65536 + green*256 + blue. Anything above white
; (16777215) means "use the HUD colour the player set", which is the default.
;
; Fallout 4's own cells are white in FavoritesMenu.swf, and nothing in that
; menu's ActionScript ever sets a colour: the engine tints menus by wrapping a
; display object in a BSGFxShaderFXTarget and calling SetToHUDColor, which
; renews its filters on every colour update. White is only what the tint is
; applied to. Our menu is our own and hangs on none of that, so the colour is
; put in one step earlier, here.   Default: 16777216

GridBackdrop=0
; A plate behind the whole panel. Fallout 4 draws its interface without one --
; the cross has no backdrop either -- so this is off, and the cells carry the
; contrast themselves.   Default: 0

HideCrosshair=1
; Puts the HUD's crosshair out of sight while the favorites menu is open. It
; sits in the middle of the screen, which is where the grid is, and it aims at
; nothing while a menu is up. The HUD itself is not changed -- one clip is
; hidden and shown again. A replaced HUD that names its crosshair something
; other than HUDCrosshair_mc simply keeps it, and the log says so.
;   Default: 1

GridProbeStage=0
; Outlines the whole stage and marks its corners, to see which parts of it
; reach the screen at all. Only useful when something is being cut off.
; Default: 0

StripItemTags=1
; FIS (FallUI Item Sorter) renames items to "[Tag] Name", and the menus of
; FallUI and DEF_UI turn that tag into an icon. The favorites cross is not one
; of those menus, so it prints the tag as it stands -- "[Aid] Antibiotics".
; With this on, the tag is left out of the label. Set it to 0 to keep the name
; exactly as the game has it.   Default: 1

ShowPageIndicator=1
; Writes the page into the favorites menu itself, hung on the cross so it
; follows wherever another mod has put it. Deliberately not the game's corner
; notification: players rebuild the HUD to taste, and the favorites menu is
; the one place that usually stays as it is.   Default: 1

PageIndicatorText=Favorites
; The word in front of the numbers. Leave it empty for "2 / 3" alone.
; Default: Favorites

PageIndicatorY=4
PageIndicatorX=0
; Where it sits, measured from the cross as it is actually drawn: Y is the
; gap below it, X shifts it sideways from the middle. Negative Y moves it up
; into the cross.   Defaults: 4 and 0

PageIndicatorFont=
; Which font the marker draws with. Empty means the one the cross labels its
; own keys with, which is always a font the menu has. A name the menu does not
; have comes out as a row of boxes; "$MAIN_Font" is the game's own alias for
; its main font.   Default: empty

PageIndicatorSize=18
; Text size.   Default: 18

PageIndicatorColor=16777216
; A colour as one number, red*65536 + green*256 + blue. Anything above white
; (16777215) means "use the HUD colour the player set", which is what the
; default does.   Default: 16777216

[Pages]

; The twelve keys are shared between several pages. Turning a page parks
; everything the current page holds -- the items stay favorited, they only
; lose their key -- and hands the keys to the items of the next one. Nothing
; is ever deleted, so an interrupted switch costs at worst a key.
;
; The pages travel in the save game itself, through F4SE's co-save, so every
; character keeps their own.

PageCount=3
; How many pages to turn between, 1 to 32. Page 1 is whatever the character
; had when the pages were first used.   Default: 3

DefaultPage=0
; The page put back into the game's twelve keys whenever the favorites menu
; closes, counted from 1. Zero leaves whichever page was last used there,
; which is what happened before this setting existed.
;
; Why it matters: the grid draws every page alike, so "the page you are on"
; is not something you can see any more -- and the game's own digit keys can
; only ever reach the page the engine holds. Left alone, the same digit does
; something different depending on which cell you clicked ten minutes ago.
; Setting this makes the digits mean one fixed page.
;
; It is not free: a page switch moves every favorite through the engine, one
; key at a time, and this does it on every close of the menu. That is why it
; is off until you ask for it.   Default: 0

PageMessage=
; The game's own corner notification when a page is turned. Empty means none,
; which is the default -- the marker in the menu says it better. Put a word
; here to switch it on; the numbers are appended.   Default: empty

NextPageKey=PAGEDOWN
; One page forward, wrapping around at the end.   Default: PAGEDOWN

PreviousPageKey=PAGEUP
; One page back.   Default: PAGEUP

[Controls]

; Walking the grid, and using what is marked.
;
; These keys mean something only while the favorites menu is open and the
; grid is up. The grid stands in front of everyone else in the game's list of
; input handlers and claims exactly these keys; everything it does not claim
; -- the digits, the key that closes the menu, the gamepad -- goes through
; untouched.
;
; The mark is where the grid is pointing. Moving the mouse over a cell marks
; it; the keys below walk from wherever the mark stands, wrapping around at
; both ends. Whichever moved last has the mark, and the mouse only speaks
; while it is over a cell, so leaving the panel does not undo a choice made
; with the keys.

GridPageUpKey=W
GridPageDownKey=S
; One page up and down -- the rows of the panel.   Defaults: W and S

GridLeftKey=A
GridRightKey=D
; One key left and right, within a page.   Defaults: A and D

GridUseKey=E
GridUseAltKey=RETURN
; Uses what is marked: the same thing that happens when its digit is pressed,
; through the engine's own UseQuickkeyItem. A cell on another page turns to
; that page first -- the twelve keys belong to one page at a time, and the
; engine is what hands them out.
;
; Two of them, because E is what a hand reaches for -- it activates everything
; else in this game -- and RETURN is what a menu answers to. Neither is worth
; taking away from the other.   Defaults: E and RETURN

GridMoveKey=G
; Picks the marked cell up; the next press puts it down on whatever is marked
; then, and the two change places. Works across pages, which is the point:
; that is how something moves from page 3 to page 1 without going through the
; Pip-Boy.
;
; It is an exchange, not an insertion. Anything else would have to push a
; third item somewhere, and there is no somewhere.   Default: G

GridClearKey=DELETE
; Frees the key the mark sits on. Nothing is deleted and nothing stops being
; a favorite: the item goes to the same "favorited, no key" state the game
; writes when you favorite something in the Pip-Boy without assigning a
; digit. On a page that is not being played, the key is simply forgotten.
;   Default: DELETE

GridWrap=1
; Whether the ends of a row and of the stack are doors or walls -- whether
; moving right from the last key comes back to the first. There is no right
; answer to this one, which is why it is a setting.   Default: 1

GridUseOnClick=1
; The left mouse button does the same as the use key. Set it to 0 to leave
; the button alone and use the keyboard only.   Default: 1

GridCloseAfterUse=1
; Closes the favorites menu after something was used, the way the cross does
; when a digit is pressed.   Default: 1

[Debug]

; The keys of the current test build. They will go away once the grid itself
; is here; until then they are the whole user interface.
;
; A key is written by name -- F6, DELETE, NUMPAD7, PAGEUP -- or as a virtual
; key code in decimal or hex (0x75). NONE switches a key off.
;
; Pick keys the game and your other software leave alone. F5 and F9 are
; quicksave and quickload in Fallout 4, and on this machine Special K takes
; F8 and F9 for screenshots.

InventoryProbeKey=F6
; Writes the twelve favorites to the log, as the inventory has them and as
; the game's own copy has them.   Default: F6

FavoriteRoundTripKey=F7
; A round trip on one key, and now the real thing. The first press takes the
; lowest favorite off its key -- it stays a favorite, at -1, the same state
; the game itself writes when you favorite something that has no key. The
; second press gives the key back. Both halves go through the engine's own
; SetFavoriteIndex, so nothing happens behind its back any more.
;   Default: F7

RotateFavoritesKey=F8
; Moves every favorite up one key, with the topmost one wrapping around to the
; lowest. That is a whole page applied in one go, and enough presses bring
; everything back where it started.   Default: F8

; ---- Reading the engine's own code -----------------------------------------
;
; Fallout4.exe is packed on disk, so its machine code can only be read from
; the running game. These settings copy pieces of it into
; FavoritesMenuGrid.peek.txt next to the log, where tools/f4dis.py turns them
; into a disassembly. They are read at the moment of the dump, so a new
; question needs an edit here and a press of PeekKey, not a restart.
;
; Reading only -- nothing here changes the game -- and empty means off.
; A place is an Address Library ID or, under PeekRVAs, an offset from the
; start of the module. After a colon comes how much to copy; without one,
; the whole function around the address is written out.

UseQuickkeyID=
UseQuickkeyRVA=
; Where FavoritesManager::UseQuickkeyItem lives -- the engine's own way of
; using a favorite, which is what a click or the use key needs. Until one of
; these names an address, using a cell does nothing at all.
;
; It has no known Address Library ID, and the signature FavoritesMenuEx
; carries for it leads to a classifier instead, which cost one crash. So it
; is read rather than searched: every start writes FavoritesManager's own
; OnButtonEvent out to FavoritesMenuGrid.found.txt next to the log, and
;
;   py -3 tools/f4dis.py peek "...\FavoritesMenuGrid.found.txt"
;
; shows the call inside it. Put the answer here -- an ID under the first, an
; offset from the start of the module under the second (0x1271480).
;   Defaults: both empty

PeekKey=F10
; Writes the dump again with whatever stands here now.   Default: F10

PeekIDs=
; Address Library IDs. Each is written out as the whole function it sits in,
; or as many bytes as stand after a colon.   Default: empty

PeekRVAs=
; The same by offset from the start of the module, for a place that has no
; ID of its own.   Default: empty

PeekVtableRefs=
; Vtable IDs. Every place in the code that points at one is written out with
; the function around it, which is where the engine builds such an object for
; itself -- and that says what its fields mean.
;   1064496  SetFavoriteFunctor -- answered: vtable at 0x00, both split flags
;            false at 0x08, the key index as one byte at 0x10
; Default: empty
