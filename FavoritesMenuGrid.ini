; ============================================================================
; Favorites Menu Grid - F4SE
;
; Several pages of Fallout 4's twelve favorite keys, drawn all at once as a
; grid you can point at, walk with the keys or a controller, and use from.
; The same grid stands in for the Pip-Boy's ASSIGN FAVORITE cross, so a
; favorite can be put straight onto any page.
;
; This file lives in Data\F4SE\Plugins next to the DLL. It is read once when
; the game starts, so a change needs a restart.
;
; Every option: its accepted values, then what it does. Keep the section
; names as they are.
; ============================================================================


; ----------------------------------------------------------------------------
[Pages]
; ----------------------------------------------------------------------------

PageCount=3
; 1 to 8.   Default: 3
; How many pages of twelve keys you have. Page 1 is what the character already
; had when the pages were first used. Lowering the number later drops the
; pages beyond it: their items stay favorites, but lose their place.

DefaultPage=0
; 0, or a page number from 1 to PageCount.   Default: 0
; The page put back into the game's real twelve keys whenever the favorites
; menu or the Pip-Boy closes, so the digits 1-0 in gameplay always mean this
; page. 0 leaves whichever page you last used.


; ----------------------------------------------------------------------------
[Grid]
; ----------------------------------------------------------------------------

GridCellSize=48
; 24 to 96.   Default: 48
; The size of one cell, in the game's menu units (the screen is 1280 by 720).
; Everything else scales with it. 48 makes the grid about half the screen
; wide, 64 two thirds.

ShowPageNumbers=1
; 0 or 1.   Default: 1
; The page numbers down the left side.

GridCorners=0
; 0 or 1.   Default: 0
; Four short corner marks around the grid, the way the game frames a target.

GridBackdrop=0
; 0 to 100.   Default: 0
; A dark plate behind the grid, in percent; 0 draws none, the way the game
; draws its own cross. Try 70 if the icons are hard to see against the sky.

HideCrosshair=1
; 0 or 1.   Default: 1
; Hides the HUD crosshair while the favorites menu is open; it sits exactly
; where the grid is.

PauseGame=0
; 0 or 1.   Default: 0
; Stops the game while the favorites menu is open, the way the Pip-Boy does.
; Off, the world keeps moving and the menu is as quick as the game's own.

ShowKeyHints=1
KeyHintExtra=TAB) CLOSE
; 0 or 1, and a line of text.   Defaults: 1 and "TAB) CLOSE"
; A line under the grid naming the keys it answers to, built from your actual
; bindings - rebind a key and the line follows. On a controller it shows the
; buttons with the game's own button art.
;
; KeyHintExtra is added to the end as written. The key that closes the
; favorites menu is the one you opened it with, and the game does not tell
; this mod which that is - so say it here. Not used on a controller, where
; that button is known.


; ---- Icons -----------------------------------------------------------------
;
; Icons come from an item sorter and an icon library you already have -
; FallUI's Item Sorter (FIS) and FallUI Icon Library, or DEF_UI. Nothing of
; that is shipped with this mod. Without them the cells show names only, and
; everything else works the same.

UseIcons=1
; 0 or 1.   Default: 1
; Draws each item's icon in its cell, as in FallUI's menus.

IconFallback=1
; 0 or 1.   Default: 1
; Gives an item a symbol even when no sorter has tagged it, by what kind of
; thing it is: a gun gets the rifle symbol, a melee weapon the one for its
; grip, armour the vest, aid the med kit.

IconColors=1
; 0 or 1.   Default: 1
; Paints icons in the colours your sorter configuration asks for, from the
; colour set chosen in FallUI's settings. 0 leaves the artwork uncoloured.

StripItemTags=1
; 0 or 1.   Default: 1
; Drops the "[Aid]" a sorter puts in front of an item's name before the grid
; shows it.


; ----------------------------------------------------------------------------
[Controls]
; ----------------------------------------------------------------------------
;
; These keys mean something only while the favorites menu is open, or while
; the grid stands in the Pip-Boy's ASSIGN FAVORITE dialog. Everything not
; listed here - the digits, the key that closes the menu - reaches the game
; untouched.
;
; A key is written by name (E, DELETE, INSERT, F6, PAGEUP), as a numeric key
; code, or NONE to switch it off.

GridPageUpKey=W
GridPageDownKey=S
GridLeftKey=A
GridRightKey=D
; Defaults: W, S, A, D
; Move the mark: a page up and down, a key left and right. Holding a key
; walks on by itself.

GridUseKey=E
; Default: E
; Uses the marked item. Return does the same and is always on.
; In the Pip-Boy, assigning is the dialog's own Accept, as always.

GridUseOnClick=1
; 0 or 1.   Default: 1
; The left mouse button uses the cell under the pointer - or, in the Pip-Boy,
; assigns to it.

GridCloseAfterUse=1
; 0 or 1.   Default: 1
; Closes the favorites menu after something was used, as the vanilla cross
; does. If the game refuses the item, the menu stays open.

GridToggleEquip=1
; 0 or 1.   Default: 1
; Using a weapon or armour you already have equipped takes it off again. Aid
; is never affected.

GridMoveKey=INSERT
; Default: INSERT
; Picks up the marked favorite; the next press puts it down on the marked
; cell, and the two change places. Works across pages.

GridClearKey=DELETE
; Default: DELETE
; Frees the marked key. The item stays a favorite, just without a key - the
; same state the game gives a favorite you never assigned a digit to.

GridWrap=1
; 0 or 1.   Default: 1
; Whether moving past the end of a row or the last page comes back around to
; the start.

GridHidePointer=1
; 0 or 1.   Default: 1
; Hides the mouse pointer while the keys or the D-pad move the mark, and
; brings it back when the mouse moves.

GridGamepad=1
GridGamepadStick=1
; 0 or 1.   Defaults: 1 and 1
; Whether a controller works the grid, and whether the left stick moves the
; mark as well as the D-pad.
;
; D-pad moves, A uses, X picks up, Y clears. B and the button that opens the
; favorites menu are never taken - they close it.
