; Favorites Menu Grid for Fallout 4
;
; This file lives in Data\F4SE\Plugins next to the DLL. It is read once when
; the plugin loads, so changes need a restart of the game.
;
; The mod shows all of your favorite pages at once, on a grid of its own, with
; a pointer. Every cell is one move away: the mouse or the keys reach any key
; on any page, and using one turns to its page on the way.


[Display]

GridX=-1
GridY=-1
; Where the panel sits, in stage units of the 1280x720 stage Fallout 4 lays
; its menus out on. -1 means centred.   Defaults: -1 and -1

GridCellSize=48
; How big one cell is, in those same units. Everything else -- gaps, margins,
; the key numbers, the icons -- follows from this one number, so it is the
; one to turn. 24 to 96.
;
; For scale: 48 makes the panel about half the screen wide, 64 two thirds.
;   Default: 48

GridColor=16777216
; The colour of the whole panel, as one number: red*65536 + green*256 + blue.
; Anything above white (16777215) means "use the HUD colour the player set",
; which is the default.
;
; Fallout 4's own cells are white in FavoritesMenu.swf and nothing in that
; menu ever sets a colour: the engine tints its menus afterwards. Ours is its
; own menu and hangs on none of that, so the colour goes in one step earlier,
; here.   Default: 16777216

ShowPageNumbers=1
; The page numbers down the left side. They are the one thing on the panel
; that says which row is which; a player who knows their own pages by what is
; on them can set this to 0, and the panel gets that much narrower.
;   Default: 1

GridCorners=0
GridCornerLength=12
GridCornerThickness=2
GridCornerOutset=5
; Four short right angles around the grid, the way the game frames a target or
; something chosen. Not an outline: an outline closes a thing off, a corner
; mark points at it.
;
; Length is how far each arm reaches, as a percentage of a cell, so it follows
; GridCellSize. Thickness and outset are in stage units. The defaults are
; taken from the compass along the bottom of the screen -- the game's own line
; weight is one stage unit, and a heavier stroke reads as a border rather than
; as a mark.   Defaults: 0, 12, 2, 5

GridBackdrop=0
; A plate behind the whole panel. Fallout 4 draws its interface without one --
; the vanilla cross has no backdrop either -- so this is off, and the cells
; carry the contrast themselves.   Default: 0

HideCrosshair=1
; Puts the HUD's crosshair out of sight while the menu is open. It sits in the
; middle of the screen, which is where the grid is, and it aims at nothing
; while a menu is up. The HUD itself is not changed: one clip is hidden and
; shown again, on every frame, because on a heavily modded game more than one
; mod may have an opinion about that crosshair.
;
; A replaced HUD that names its crosshair something other than
; HUDCrosshair_mc simply keeps it, and the log says so.   Default: 1


; ---- The writing above and below the grid ---------------------------------

LabelSize=28
LabelDetailSize=22
; The two lines above the grid: the name of what is marked, and under it what
; it does -- damage and ammunition for a weapon, resistances for a piece of
; armour, how many there are of everything else.
;
; In stage units, and these are the game's own numbers: Fallout 4 draws its
; item name at 28 and the line under it at 24. Deliberately not a fraction of
; the cell, so the writing stays readable when the cells are made small.
; 8 to 72.   Defaults: 28 and 22

LabelGap=16
; The air under those two lines, before the key names begin. A text field is
; taller than the type in it, so the band cannot be measured from the sizes
; alone. 0 to 96.   Default: 16

KeyRowGap=8
; How far the first row of cells stands below the row of key names.
; 0 to 64.   Default: 8

ShowKeyHints=1
KeyHintExtra=TAB) CLOSE
KeyHintSize=14
; A line under the panel naming the keys it answers to, the way the game
; writes its own along the bottom of a screen. It is built from the keys as
; they are actually bound, so changing one changes the line.
;
; KeyHintExtra is appended as it stands. It is plain text rather than a
; binding because the key that closes the favorites menu belongs to the game:
; whatever you opened the menu with is what closes it.
;   Defaults: 1, "TAB) CLOSE", 14

GridFont=
; Which font the panel is written in. Empty means the one the vanilla cross
; labels its own keys with, which is measured out of the menu at every opening
; and is therefore always a font the player really has. A name the movie does
; not have comes out as a row of boxes; the log says which one ended up in
; use.   Default: empty


; ---- Icons ----------------------------------------------------------------

UseIcons=1
; Draws each cell's item icon, the same symbol the player already sees in
; FallUI's menus. Nothing of that is shipped with this mod: an item sorter
; renames items with a tag in front -- "[Aid] Antibiotics" -- and a tag
; configuration under Data\Interface\ItemSorter maps that tag to a symbol in
; an icon library. Both are read where the player already has them.
;
; Every configuration found is read and merged, so it does not matter which
; sorter is active. Alternative icon sets are only read when MCM says they are
; chosen. Each mod that brings its own artwork brings its own library, and
; only the libraries a page actually needs are loaded.
;
; Without a sorter, or without any library, the cells stay empty and
; everything else works unchanged.   Default: 1

IconFallback=1
; Gives something a symbol even when no sorter has heard of it -- which on a
; heavily modded game is most weapons. It goes by what kind of thing it is: a
; gun gets the rifle symbol, a melee weapon the one for its grip, armour the
; vest, clothing the shirt, aid the med kit. Every one of those is a symbol
; the sorter defines itself, so it matches the rest.   Default: 1

IconColors=1
; Paints an icon in the colour its tag asks for -- aid red, explosives orange.
; The artwork is tinted rather than replaced, so the light and dark parts of a
; drawing survive. Set it to 0 to leave the icons white.   Default: 1

IconFit=78
; How much of a cell an icon fills, in percent, with its proportions kept.
; 20 to 100.   Default: 78

StripItemTags=1
; An item sorter renames items to "[Tag] Name". With this on, the tag is left
; out of the name shown above the grid -- the icon says the same thing better.
; Set it to 0 to show the name exactly as the game has it.   Default: 1


[Pages]

; The twelve keys are shared between several pages. Turning a page parks
; everything the current page holds -- the items stay favorited, they only
; lose their key -- and hands the keys to the items of the next one. Nothing
; is ever deleted, so an interrupted switch costs at worst a key.
;
; The pages travel in the save game itself, through F4SE's co-save, so every
; character keeps their own.

PageCount=3
; How many pages to turn between, 1 to 32. Page 1 is whatever the character
; had when the pages were first used.   Default: 3

DefaultPage=0
; The page put back into the game's twelve keys whenever the favorites menu
; closes, counted from 1. Zero leaves whichever page was last used there.
;
; Why it matters: the grid draws every page alike, so "the page you are on" is
; not something you can see -- and the game's own digit keys can only ever
; reach the page the engine holds. Left alone, the same digit does something
; different depending on which cell you used ten minutes ago. Setting this
; makes the digits mean one fixed page.
;
; It is not free: a page switch moves every favorite through the engine, one
; key at a time, and this does it on every close of the menu.   Default: 0

PageMessage=
; The wording of the game's corner message when a page is turned. Empty does
; not mean "never": it means "only where the panel cannot show it anyway",
; which is the Pip-Boy. Assigning a favorite there writes into whichever page
; the engine holds, and a silent page switch would be a trap.   Default: empty

NextPageKey=PAGEDOWN
PreviousPageKey=PAGEUP
; Turning a page from outside the grid -- in the Pip-Boy above all, where they
; decide which page a newly assigned favorite lands on. While the grid is up
; they do nothing: every cell of every page is already one move away.
;   Defaults: PAGEDOWN and PAGEUP


[Controls]

; These keys mean something only while the favorites menu is open and the grid
; is up. The grid stands in front of everyone else in the game's list of input
; handlers and claims exactly these; everything it does not claim -- the
; digits, the key that closes the menu, the gamepad -- goes through untouched.
;
; One limit worth knowing: a mod that reads the keyboard directly never sees
; that a menu claimed a key. That is why the defaults here avoid letters that
; gameplay mods tend to use.
;
; A key is written by name -- E, DELETE, INSERT, F6, PAGEUP -- or as a virtual
; key code in decimal or hex (0x2D). NONE switches a key off.

GridPageUpKey=W
GridPageDownKey=S
; One page up and down -- the rows of the panel.   Defaults: W and S

GridLeftKey=A
GridRightKey=D
; One key left and right, within a page.   Defaults: A and D

GridRepeatDelay=400
GridRepeatRate=90
; Holding a direction: how long before the mark walks on by itself, and how
; long between steps after that, in milliseconds. Only the four above repeat.
;   Defaults: 400 and 90

GridWrap=1
; Whether the ends of a row and of the stack are doors or walls -- whether
; moving right from the last key comes back to the first.   Default: 1

GridUseKey=E
GridUseAltKey=RETURN
GridUseOnClick=1
; Uses what is marked. A cell on another page turns to that page first -- the
; twelve keys belong to one page at a time, and the engine is what hands them
; out.
;
; Two keys, because E is what a hand reaches for -- it activates everything
; else in this game -- and Return is what a menu answers to. The left mouse
; button does the same; set GridUseOnClick to 0 to leave it alone.
;   Defaults: E, RETURN, 1

GridToggleEquip=1
; A second press on something you are already wearing or holding takes it off
; again, the way holstering works everywhere else in this game.
;
; It is the engine's own doing, not a second call of ours: one call inside the
; game's use-a-favorite routine carries a boolean that means "and take it off
; again if it is already on", and the game always passes false. This turns it
; around, and only for presses that come from this menu. Because the engine
; does it, the engine's rules apply, power armour included.   Default: 1

GridMoveKey=INSERT
; Picks the marked cell up; the next press puts it down on whatever is marked
; then, and the two change places. Works across pages, which is the point:
; that is how something moves from page 3 to page 1 without going through the
; Pip-Boy. It is an exchange, not an insertion.   Default: INSERT

GridClearKey=DELETE
; Frees the key the mark sits on. Nothing is deleted and nothing stops being a
; favorite: the item goes to the same "favorited, no key" state the game
; writes when you favorite something without assigning a digit.
;   Default: DELETE

GridCloseAfterUse=1
; Closes the favorites menu after something was used, the way the vanilla
; cross does when a digit is pressed. A refusal leaves it open -- the game has
; just said no out loud.   Default: 1


[Debug]

; For working on the mod, not for playing it. Everything here is off unless
; asked for, and reading only -- nothing in this section changes the game.
;
; Fallout4.exe is packed on disk, so its machine code can only be read from
; the running game. These settings copy pieces of it into
; FavoritesMenuGrid.peek.txt next to the log, where tools/f4dis.py turns them
; into a disassembly. They are read at the moment of the dump, so a new
; question needs an edit here and a key press, not a restart.

PeekKey=F10
; Writes the dump again with whatever stands here now.   Default: F10

PeekIDs=
; Address Library IDs, comma separated. Each is written out as the whole
; function it sits in, or as many bytes as stand after a colon: 534268:0x120
;   Default: empty

PeekRVAs=
; The same by offset from the start of the module, for a place that has no ID
; of its own.   Default: empty

PeekVtableRefs=
; Vtable IDs. Every place in the code that points at one is written out with
; the function around it, which is where the engine builds such an object for
; itself -- and that says what its fields mean.   Default: empty
